[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codecompactforai"
version = "1.0.0"
description = "Prepare projects for AI without sending the whole codebase"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
codemerge = "codemerge:main"

[project.optional-dependencies]
dev = ["pytest", "tiktoken"]

[tool.setuptools]
py-modules = ["codemerge"]