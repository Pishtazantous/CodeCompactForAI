[project]
name = "codecompactforai"
version = "1.0.0"
description = "Prepare projects for AI without sending the whole codebase"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
codemerge = "codemerge:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]